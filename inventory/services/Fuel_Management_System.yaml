schema: 1
repo: Fuel_Management_System
name: Fuel Management
id: fuel
live: true
host: propeval
public:
- name: 204.168.132.89:8088
  url: https://204.168.132.89:8088/
  edge: nginx :8088 TLS, proxy to 127.0.0.1:8098, Let's Encrypt IP certificate
  health: https://204.168.132.89:8088/api/health
process:
  name: fuel.service
  bind: 127.0.0.1:8098
  listen_public: false
  runtime: python3 -m server
store: SQLite /home/propeval/fuel-management/data/fuel.db
outbound:
- to: On-site CCU
  what: Start and stop fueling. Tank poll every 10 seconds.
- to: api.samsara.com
  what: Vehicle and equipment import when an admin syncs.
notes: 'Web UI, user logins, QR fueling sessions, and the CCU telemetry store share
  204.168.132.89 with Property Evaluation and Energy Infrastructure. Ports 80 and
  443 stay on propeval.simba.services. Ports 8443 and 8444 stay on the energy map.
  ufw allows 8088. The app itself binds 127.0.0.1:8098. The on-site Raspberry Pi posts
  telemetry every 10 seconds and receives start and stop on its own command API.

  '
