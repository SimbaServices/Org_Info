# Fallback until SimbaServices/Energy_Infr has network.yaml readable by generate.
# Same host as Property Evaluation. Do not put 8443 on the GovDeals shared host.
schema: 1
org_extra: true
repo: Energy_Infr
name: Energy Infrastructure
id: energy
live: true
host: propeval
public:
- name: 204.168.132.89:8443
  url: https://204.168.132.89:8443/
  edge: nginx :8443 static, Let's Encrypt IP certificate
  health: https://204.168.132.89:8443/
- name: 204.168.132.89:8444
  url: https://204.168.132.89:8444/
  edge: nginx sandbox :8444, /api/ to 127.0.0.1:8766
  health: null
  probe: false
  note: Sandbox copy; not probed
process:
  name: energy-surface.service
  bind: 127.0.0.1:8766
  listen_public: false
  runtime: sandbox /api only; production map is static nginx
store: db/us_pipelines.sqlite
edge_steps:
- title: nginx :8443
  detail: 204.168.132.89 · /var/www/energy
- title: nginx :8444
  detail: sandbox · /var/www/energy-sandbox
- title: energy-surface.service
  detail: 127.0.0.1:8766 · sandbox /api only
outbound:
- to: State public well services
  what: Monthly agent refresh of vented and flared layers
- to: EIA and HIFLD
  what: Pipeline, capacity, and transmission layers in the database
notes: Shares the Property Evaluation host. Ports 80 and 443 stay on propeval.simba.services.
  This map is a separate nginx root on 8443. Sandbox is 8444. TLS is a short-lived
  Let's Encrypt certificate for the public IP, renewed by certbot-energy.timer.
  energy-agents.timer publishes web/ to /var/www/energy on the 1st of each month.
